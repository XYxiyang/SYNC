version: 0
model:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 128
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  token_type: 158
  edge_type: 6
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
data:
  root: sbdd/sdf/
  train: train_80w_sbdd_lin_8.pt
  val: val_80w_sbdd_lin_8.pt
  test: test_80w_sbdd_lin_8.pt
  #eval: [nonpher_test_sbdd_lin.pt, gasa_test1_sbdd_lin.pt, gasa_test2_sbdd_lin.pt, gasa_test3_sbdd_lin.pt]
  #eval: ["3dsbdd.pt", "d3fg.pt", "decompdiff.pt", "diffbp.pt", "diffsbdd.pt", "flag.pt", 
  #            "graphbp.pt", "ligan.pt", "molcraft.pt", "pocket2mol.pt", "targetdiff.pt", "voxbind.pt",
  #            "enamine.pt", "compas.pt"]
  #eval: [test_10w.pt]
  #eval: ["guide_1_10_sbdd.pt", "guide_1_50_sbdd.pt", "guide_1_100_sbdd.pt", "guide_1_200_sbdd.pt", "guide_1_500_sbdd.pt", "guide_1_1000_sbdd.pt"]
  eval: ["pocket_1_sbdd_lin.pt"]
seed: 530
train:
  batch_size: 256
  max_epoch: 50
  val_freq: 1
  grad_clip: 1.0
  lr: 1.e-3
  min_lr: 1.e-5
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.01
  scheduler:
    type: plateau
    factor: 0.6
    patience: 1
  save_dir: exps/syn3d_sbdd
  metric_min_better: False
  save_topk: 3
  tag: 
  num_workers: 8
