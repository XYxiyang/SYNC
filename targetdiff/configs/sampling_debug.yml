model:
  checkpoint: ./pretrained_models/pretrained_diffusion.pt
  #checkpoint: ./logs_diffusion/dpo_2025_01_25__16_15_06/checkpoints/1800.pt

sample:
  seed: 2021
  num_samples: 20
  num_steps: 1000
  pos_only: False
  center_pos_mode: protein
  sample_num_atoms: prior

classifier:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 0
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
  token_type: 158
  edge_type: 6
  ckpt: ./pretrained_models/classifier_noedge.ckpt

evaluator:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 128
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
  token_type: 158
  edge_type: 6
  ckpt: ./pretrained_models/classifier_emb.ckpt
data:
  root: sbdd/sdf/
  eval: ["pocket_1_sbdd_lin.pt"]
train:
  batch_size: 256

data:
  name: pl
  path: ./data/crossdocked_v1.1_rmsd1.0_pocket10
  split: ./data/crossdocked_pocket10_pose_split.pt
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: False