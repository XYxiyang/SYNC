data:
  name: pair
  path: ./data/crossdocked_v1.1_rmsd1.0_pocket10
  split: ./data/crossdocked_pocket10_pose_split.pt
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: false
data_val:
  name: pl
  path: ./data/crossdocked_v1.1_rmsd1.0_pocket10
  split: ./data/crossdocked_pocket10_pose_split.pt
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: false
model:
  model_mean_type: C0
  beta_schedule: sigmoid
  beta_start: 1.0e-07
  beta_end: 0.002
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 1000
  loss_v_weight: 100.0
  sample_time_method: symmetric
  time_emb_dim: 0
  time_emb_mode: simple
  center_pos_mode: protein
  node_indicator: true
  model_type: uni_o2
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: true
  cutoff_mode: knn
  ew_net_type: global
  num_x2h: 1
  num_h2x: 1
  r_max: 10.0
  x2h_out_fc: false
  sync_twoup: false
  checkpoint: ./pretrained_models/pretrained_diffusion.pt
train:
  seed: 2021
  batch_size: 4
  num_workers: 4
  n_acc_batch: 1
  max_iters: 90000
  val_freq: 100
  pos_noise_std: 0.1
  max_grad_norm: 1.0
  bond_loss_weight: 1.0
  optimizer:
    type: adam
    lr: 2.0e-06
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.0e-06
  pair_indices: indices.npy
  validate_on_test: false
classifier:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 0
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
  token_type: 158
  edge_type: 6
  ckpt: ./pretrained_models/classifier_noedge.ckpt
sample:
  seed: 2021
  num_samples: 100
  num_steps: 1000
  pos_only: false
  center_pos_mode: protein
  sample_num_atoms: prior
