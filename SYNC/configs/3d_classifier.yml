version: 0
model:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 128
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
data:
  root: data/sbdd/sdf/
  train: train_80w.pt
  val: val_80w.pt
  test: test_80w.pt
  #eval: [nonpher_test.pt, gasa_test1.pt, gasa_test2.pt, gasa_test3.pt]
  eval: ["3dsbdd.pt", "d3fg.pt", "decompdiff.pt", "diffbp.pt", "diffsbdd.pt", "flag.pt", 
              "graphbp.pt", "ligan.pt", "molcraft.pt", "pocket2mol.pt", "targetdiff.pt", "voxbind.pt",
              "enamine.pt", "compas.pt"]
  #eval: [test_10w.pt]
  #eval: [enamine.pt]
  #eval: [compas.pt]
seed: 530
train:
  batch_size: 256
  max_epoch: 50
  val_freq: 1
  grad_clip: 1.0
  lr: 2.e-3
  min_lr: 1.e-5
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.01
  scheduler:
    type: plateau
    factor: 0.6
    patience: 1
  save_dir: exps/syn3d
  metric_min_better: False
  save_topk: 3
  tag: 
  num_workers: 8
