version: 0
model:
  encoder_type: graph
  encoder:
    num_atom_classes: 100
    num_bond_classes: 10
    dim: 512
    depth: 8
    dim_head: 64
    edge_dim: 128
    heads: 8
    rel_pos_emb: false
    output_norm: false
  head:
    dim_hidden: 1024
    num_classes: 2
    d_model: 512
data:
  root: data/processed/graph/
  train: train_80w.pt
  val: gasa_test1.pt
  test: test_80w.pt
  #eval: [nonpher_test.pt, gasa_test1.pt, gasa_test2.pt, gasa_test3.pt]
  eval: ["3dsbdd.pt", "d3fg.pt", "decompdiff.pt", "diffbp.pt", "diffsbdd.pt", "flag.pt", 
              "graphbp.pt", "ligan.pt", "molcraft.pt", "pocket2mol.pt", "targetdiff.pt", "voxbind.pt",
              "enamine.pt", "compas.pt"]
  #eval: [test_10w.pt]
seed: 530
train:
  batch_size: 256
  max_epoch: 30
  val_freq: 1
  grad_clip: 1.0
  lr: 1.e-3
  min_lr: 1.e-5
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.01
  scheduler:
    type: plateau
    factor: 0.6
    patience: 1
  save_dir: exps/syn2d
  metric_min_better: False
  save_topk: 3
  tag: 
