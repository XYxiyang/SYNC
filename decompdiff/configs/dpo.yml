data:
  name: pair
  path: ./data/crossdocked_v1.1_rmsd1.0_processed
  split: ./data/split_by_name.pt
  mode: full
  include_dummy_atoms: False
  version: ref_prior_aromatic
  prior_mode: ref_prior
  transform:
    add_ord_feat: False
    ligand_atom_mode: basic
    ligand_bond_mode: fc
    max_num_arms: 10
    random_rot: False

data_val:
  name: pl
  path: ./data/crossdocked_v1.1_rmsd1.0_processed
  split: ./data/split_by_name.pt
  mode: full
  include_dummy_atoms: False
  version: ref_prior_aromatic
  prior_mode: beta_prior
  transform:
    add_ord_feat: False
    ligand_atom_mode: basic
    ligand_bond_mode: fc
    max_num_arms: 10
    random_rot: False

model:
  checkpoint: pretrained_models/uni_o2_bond.pt

sample:
  seed: 2021
  gen_mode: complete
  init_pos_mode: protein_center
  prior_mode: ref_prior
  num_samples: 20
  num_steps: 1000
  pos_only: False
  center_pos_mode: protein
  sample_num_atoms: prior
  arms_num_atoms_config: ./utils/evaluation/arm_num_config.pkl
  scaffold_num_atoms_config: ./utils/evaluation/scaffold_num_config.pkl
  energy_drift:
    - type: armsca_prox
      min_d: 1.2
      max_d: 1.9
    - type: clash
      sigma: 2
      gamma: 4

classifier:
  encoder_type: egnn
  encoder:
    in_node_nf: 128
    in_edge_nf: 0
    out_node_nf: 128
    hidden_nf: 128
    n_layers: 4
    device: cuda:0
  head:
    dim_hidden: 256
    num_classes: 2
    d_model: 128
  token_type: 158
  edge_type: 6
  ckpt: ./pretrained_models/classifier_knn_8atom.ckpt

train:
  seed: 2021
  loss_weights:
    pos: 1.0
    v: 100.0
    bond: 100.0
  batch_size: 4
  num_workers: 4
  n_acc_batch: 1
  max_iters: 90000
  val_freq: 200
  pos_noise_std: 0.1
  prior_noise_std: 0.5
  max_grad_norm: 8.0
  bond_loss_weight: 1.0
  optimizer:
    type: adam
    lr: 2.e-6
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6